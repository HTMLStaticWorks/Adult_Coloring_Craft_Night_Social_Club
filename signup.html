<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Login | Color & Company</title>
  <meta name="description" content="Sign in to your Color & Company member dashboard.">
  <link rel="canonical" href="login.html">
  <link rel="stylesheet" href="assets/css/style.css">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body data-page="login" style="background:var(--color-surface);min-height:100vh;display:flex;flex-direction:column">

  <!-- Absolute Top-Right Controls -->
  <div
    style="position: absolute; top: var(--space-md); right: var(--space-md); display: flex; gap: 8px; z-index: 10; color: var(--color-text);">
    <button class="btn-icon" data-theme-toggle style="color: var(--color-text);" aria-label="Toggle theme"><span
        class="theme-icon">🌙</span></button>
    <button class="btn-icon" data-rtl-toggle aria-label="Toggle RTL" aria-pressed="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        aria-hidden="true">
        <path d="M4 12h16" />
        <path d="M8 8l-4 4 4 4" />
        <path d="M16 8l4 4-4 4" />
      </svg>
    </button>
  </div>

  <main
    style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--space-xl) var(--space-sm)">

    <!-- Logo -->
    <a href="index.html" class="navbar__logo" aria-label="Color & Company Home"
      style="margin-bottom: var(--space-xl); display:flex; flex-direction:row; align-items:center; gap:12px; text-decoration:none;">
      <svg class="navbar__logo-mark" viewBox="0 0 42 42" fill="none" aria-hidden="true">
        <circle cx="21" cy="21" r="20" stroke="#C96F61" stroke-width="1.5" fill="none" />
        <path d="M12 28 Q14 16 21 13 Q28 10 30 21 Q32 30 21 32 Q14 34 12 28Z" stroke="var(--color-text)"
          stroke-width="1.2" fill="none" />
        <line x1="8" y1="21" x2="34" y2="21" stroke="#C96F61" stroke-width="0.8" stroke-dasharray="2 2" />
      </svg>
      <div class="navbar__logo-text"><span class="navbar__logo-name">Color & Company</span></div>
    </a>

    <div class="auth-container">
      <div style="text-align:center;margin-bottom:var(--space-lg)">
        <h1 style="font-family:var(--font-heading);font-size:2.5rem;color:var(--color-text);margin-bottom:8px">Create an
          Account.</h1>
        <p style="color:var(--color-text-muted)">Join the creative community.</p>
      </div>

      <form id="auth-form" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
        <div class="form-group"><label class="form-label" for="auth-email">Email Address</label><input type="email"
            id="auth-email" class="form-input" required value="demo@example.com"></div>

        <div class="form-group">
          <label class="form-label" for="auth-pass">Password</label>
          <div style="position: relative;">
            <input type="password" id="auth-pass" class="form-input" required value="demo123"
              style="padding-right: 40px;">
            <button type="button" class="btn-icon"
              style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; background: none; border: none; cursor: pointer; color: var(--color-text-muted);"
              onclick="const input = document.getElementById('auth-pass'); input.type = input.type === 'password' ? 'text' : 'password';">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group" style="margin-top:var(--space-sm); font-size:var(--text-sm);">
          <label style="display:flex; align-items:center; gap:6px; cursor:pointer; white-space:nowrap;"><input type="checkbox" required> I
            agree to the <a href="#" class="auth-link" style="color:var(--color-primary); text-decoration:none; margin-left: 4px;">Terms &
              Conditions</a></label>
        </div>

        <button type="submit" class="btn btn-primary w-full"
          style="justify-content:center;margin-top:var(--space-md)">Sign Up</button>
      </form>

      <div style="display:flex; align-items:center; margin: var(--space-md) 0;">
        <div style="flex:1; height:1px; background:var(--color-border);"></div>
        <div style="padding: 0 12px; color:var(--color-text-muted); font-size:var(--text-sm);">OR CONTINUE WITH</div>
        <div style="flex:1; height:1px; background:var(--color-border);"></div>
      </div>

      <div class="auth-social-buttons" style="display:flex; flex-direction:column; gap:10px;">
        <button type="button" class="btn btn-outline w-full auth-social-btn" style="justify-content:center; gap:10px;">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink:0;">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.58H1.25C.45 8.18 0 10.03 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          <span>Continue with Google</span>
        </button>
        <button type="button" class="btn btn-outline w-full auth-social-btn" style="justify-content:center; gap:10px;">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink:0;">
            <path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
          <span>Continue with Facebook</span>
        </button>
        <button type="button" class="btn btn-outline w-full auth-social-btn" style="justify-content:center; gap:10px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="flex-shrink:0;">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.92-2.87-.9.04-2 .6-2.65 1.35-.58.65-1.08 1.73-.95 2.76 1.01.08 2.05-.49 2.68-1.24z"/>
          </svg>
          <span>Continue with Apple</span>
        </button>
      </div>

      <div style="text-align:center; margin-top:var(--space-lg); font-size:var(--text-sm);">
        Already have an account? <a href="login.html" class="auth-link"
          style="color:var(--color-primary); text-decoration:none;">Log in</a>
      </div>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>

</html>
