<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Login | Color & Company</title>
  <meta name="description" content="Sign in to your Color & Company member dashboard.">
  <link rel="canonical" href="login.html">
  <link rel="stylesheet" href="assets/css/style.css">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body data-page="login" style="background:var(--color-surface);min-height:100vh;display:flex;flex-direction:column">

  <!-- Absolute Top-Right Controls -->
  <div
    style="position: absolute; top: var(--space-md); right: var(--space-md); display: flex; gap: 8px; z-index: 10; color: var(--color-text);">
    <button class="btn-icon" data-theme-toggle style="color: var(--color-text);" aria-label="Toggle theme"><span
        class="theme-icon">🌙</span></button>
    <button class="btn-icon" data-rtl-toggle aria-label="Toggle RTL" aria-pressed="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        aria-hidden="true">
        <path d="M4 12h16" />
        <path d="M8 8l-4 4 4 4" />
        <path d="M16 8l4 4-4 4" />
      </svg>
    </button>
  </div>

  <main
    style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--space-xl) var(--space-sm)">

    <!-- Logo -->
    <a href="index.html" class="navbar__logo" aria-label="Color & Company Home"
      style="margin-bottom: var(--space-xl); display:flex; flex-direction:row; align-items:center; gap:12px; text-decoration:none;">
      <svg class="navbar__logo-mark" viewBox="0 0 42 42" fill="none" aria-hidden="true">
        <circle cx="21" cy="21" r="20" stroke="#C96F61" stroke-width="1.5" fill="none" />
        <path d="M12 28 Q14 16 21 13 Q28 10 30 21 Q32 30 21 32 Q14 34 12 28Z" stroke="var(--color-text)"
          stroke-width="1.2" fill="none" />
        <line x1="8" y1="21" x2="34" y2="21" stroke="#C96F61" stroke-width="0.8" stroke-dasharray="2 2" />
      </svg>
      <div class="navbar__logo-text"><span class="navbar__logo-name">Color & Company</span></div>
    </a>

    <div class="auth-container">
      <div style="text-align:center;margin-bottom:var(--space-lg)">
        <h1 style="font-family:var(--font-heading);font-size:2.5rem;color:var(--color-text);margin-bottom:8px">Welcome
          Back.</h1>
        <p style="color:var(--color-text-muted)">Sign in to your creative dashboard.</p>
      </div>

      <form id="auth-form" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
        <div class="form-group"><label class="form-label" for="auth-email">Email Address</label><input type="email"
            id="auth-email" class="form-input" required value="demo@example.com"></div>

        <div class="form-group">
          <label class="form-label" for="auth-pass">Password</label>
          <div style="position: relative;">
            <input type="password" id="auth-pass" class="form-input" required value="demo123"
              style="padding-right: 40px;">
            <button type="button" class="btn-icon"
              style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; background: none; border: none; cursor: pointer; color: var(--color-text-muted);"
              onclick="const input = document.getElementById('auth-pass'); input.type = input.type === 'password' ? 'text' : 'password';">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="auth-options" style="margin-top:var(--space-sm); font-size:var(--text-sm);">
          <label style="display:flex; align-items:center; gap:6px; cursor:pointer;"><input type="checkbox"> Remember
            me</label>
          <a href="#" class="auth-link" style="color:var(--color-primary); text-decoration:none;">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary w-full"
          style="justify-content:center;margin-top:var(--space-md)">Sign In</button>
      </form>

      <div style="display:flex; align-items:center; margin: var(--space-md) 0;">
        <div style="flex:1; height:1px; background:var(--color-border);"></div>
        <div style="padding: 0 12px; color:var(--color-text-muted); font-size:var(--text-sm);">OR CONTINUE WITH</div>
        <div style="flex:1; height:1px; background:var(--color-border);"></div>
      </div>

      <div style="display:flex; flex-direction:column; gap:8px;">
        <button class="btn btn-outline w-full" style="justify-content:center; gap:8px;"><svg width="18" height="18"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.5 12.2c0-.8-.1-1.5-.2-2.2H12v4.2h5.4c-.2 1.4-.9 2.5-2.1 3.3v2.8h3.3c2-1.8 3.1-4.5 3.1-7.7z" />
            <path
              d="M12 21.7c2.7 0 4.9-.9 6.5-2.4l-3.3-2.8c-.9.6-2 1-3.3 1-2.5 0-4.6-1.7-5.4-4.1H3.1v2.9c1.6 3.3 5 5.4 8.9 5.4z" />
            <path d="M6.6 13.5c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V6.6H3.1C2.4 8.2 2 9.8 2 11.5s.4 3.3 1.1 4.9l3.5-2.9z" />
            <path
              d="M12 5.3c1.5 0 2.8.5 3.8 1.5l2.9-2.9C16.9 2.3 14.7 1.3 12 1.3 8 1.3 4.7 3.4 3.1 6.6l3.5 2.9c.8-2.4 2.9-4.2 5.4-4.2z" />
          </svg> Google</button>
        <button class="btn btn-outline w-full" style="justify-content:center; gap:8px;"><svg width="18" height="18"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z" />
          </svg> Facebook</button>
        <button class="btn btn-outline w-full" style="justify-content:center; gap:8px;"><svg width="18" height="18"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path
              d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
          </svg>Apple</button>
      </div>

      <div style="text-align:center; margin-top:var(--space-lg); font-size:var(--text-sm);">
        Don't have an account? <a href="signup.html" class="auth-link"
          style="color:var(--color-primary); text-decoration:none;">Sign up</a>
      </div>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>

</html>
